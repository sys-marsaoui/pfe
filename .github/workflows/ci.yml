name: CI

on:
  push:
    branches: [master, main, develop, 'feature/**']
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test Spring Boot backend
        run: mvn -B -f hiring/pom.xml test

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: front/architectui-angular-theme-free/package-lock.json
      - name: Install dependencies
        working-directory: front/architectui-angular-theme-free
        run: npm ci --legacy-peer-deps
      - name: Run Angular tests
        working-directory: front/architectui-angular-theme-free
        run: npm run test:ci
      - name: Build production frontend
        working-directory: front/architectui-angular-theme-free
        run: npm run build -- --configuration production

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: docker compose build
