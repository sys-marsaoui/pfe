services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localdev}
      MYSQL_DATABASE: hiring1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-localdev}"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./hiring
    environment:
      SERVER_PORT: 8989
      DB_URL: jdbc:mysql://mysql:3306/hiring1?useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localdev}
      MONGODB_URI: mongodb://mongo:27017/hiring1
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-dGhpcy1pcy1hLWxvY2FsLWRldi1zZWNyZXQta2V5LTEyMzQ=}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4200}
    ports:
      - "8989:8989"
    volumes:
      - cv_uploads:/app/Uploads
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./front/architectui-angular-theme-free
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  mongo_data:
  cv_uploads:
