<div class="h-100 bg-gradient">
  <div class="d-flex h-100 justify-content-center align-items-center">
    <div class="mx-auto app-login-box col-md-8 col-lg-5">
      <div class="app-logo-inverse mx-auto mb-4"></div>
      <div class="modal-dialog w-100 mx-auto">
        <div class="modal-content modern-login-card">
          <div class="modal-body">
            <div class="h5 modal-title text-center">
              <h4 class="mt-2 modern-welcome-header">
                <div class="welcome-text">Forgot your Password?</div>
                <span class="welcome-subtitle">Use the form below to recover it.</span>
              </h4>
            </div>
            <form id="recoverForm" (ngSubmit)="recoverPassword()">
              <div class="mb-3 modern-input-group">
                <label for="exampleEmail" class="form-label modern-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                  <input id="exampleEmail" name="email" type="email" placeholder="Email here..." 
                    class="form-control modern-input" [(ngModel)]="email" required>
                </div>
              </div>
              <div class="divider modern-divider"></div>
              <h6 class="mb-0 modern-signup-text">
                <a [routerLink]="['/login']" class="modern-signup-link">Sign in existing account</a>
              </h6>
            </form>
          </div>
          <div class="modal-footer clearfix modern-footer">
            <div class="w-100">
              <button type="submit" form="recoverForm" class="btn btn-primary btn-lg w-100 modern-login-btn">Recover Password</button>
            </div>
          </div>
        </div>
      </div>
      
      <div class="text-center text-white opacity-8 mt-3">
        RGI Tunis 2024
      </div>
    </div>
  </div>
</div>
