<div class="login-scene">
  <!-- Animated Background -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-wrapper">
    <!-- Logo -->
    <div class="login-brand">
      <img src="/assets/images/rgi.png" alt="RGI" class="brand-logo" />
      <h1 class="brand-name">RGI Portal</h1>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="card-inner">
        <header class="card-header">
          <h2 class="title">Connexion</h2>
          <p class="subtitle">Accédez à votre espace sécurisé</p>
        </header>

        <form class="card-form" (ngSubmit)="connect()" #loginForm="ngForm">
          <!-- Email -->
          <div class="input-field" [class.focused]="focused.email" [class.filled]="credentials.email">
            <div class="input-icon">
              <i class="bi bi-envelope"></i>
            </div>
            <input
              type="email"
              class="input-control"
              [(ngModel)]="credentials.email"
              name="email"
              placeholder=" "
              required
              email
              (focus)="onFocus('email')"
              (blur)="onBlur('email')"
            />
            <label class="input-label">Email professionnel</label>
            <div class="input-underline"></div>
          </div>

          <!-- Password -->
          <div class="input-field" [class.focused]="focused.password" [class.filled]="credentials.password">
            <div class="input-icon">
              <i class="bi bi-lock"></i>
            </div>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="input-control"
              [(ngModel)]="credentials.password"
              name="password"
              placeholder=" "
              required
              (focus)="onFocus('password')"
              (blur)="onBlur('password')"
            />
            <label class="input-label">Mot de passe</label>
            <div class="input-underline"></div>
            <button type="button" class="password-toggle" (click)="togglePassword()">
              <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>

          <!-- Options -->
          <div class="form-options">
            <label class="neumorphic-checkbox">
              <input type="checkbox" [(ngModel)]="rememberMe" name="remember" />
              <span class="checkmark"></span>
              <span class="label-text">Rester connecté</span>
            </label>
            <a routerLink="/pages/forgot-password-boxed" class="link-recover">Mot de passe oublié ?</a>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="btn-primary"
            [disabled]="!loginForm.valid"
            [class.loading]="isLoading"
          >
            <span class="btn-text">Se connecter</span>
            <span class="btn-loader"></span>
          </button>
        </form>

        <!-- Footer -->
        <footer class="card-footer">
          <p class="footer-text">
            Nouveau ici ? <a routerLink="/offres" class="link-register">Parcourir les offres et postuler</a>
          </p>
        </footer>
      </div>
    </div>

    <!-- Copyright -->
    <div class="login-footer">
      <p> 2025 RGI — Tous droits réservés</p>
    </div>
  </div>
</div>
