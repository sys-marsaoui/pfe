<div class="h-100 bg-gradient">
  <div class="d-flex h-100 justify-content-center align-items-center">
    <div class="mx-auto app-login-box col-md-8 col-lg-5">
      <div class="app-logo-inverse mx-auto mb-4"></div>
      <div class="modal-dialog w-100 mx-auto">
        <div class="modal-content modern-login-card">
          <div class="modal-body">
            <div class="h5 modal-title text-center">
              <h4 class="mt-2 modern-welcome-header">
                <div class="welcome-text">Reset Your Password</div>
                <span class="welcome-subtitle">Please enter your new password below.</span>
              </h4>
            </div>
            <form (ngSubmit)="onSubmit()">
              <div id="newPasswordGroup" role="group" class="mb-3 modern-input-group">
                <label for="newPassword" class="form-label modern-label">New Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-lock"></i></span>
                  <input
                    id="newPassword"
                    type="password"
                    placeholder="Enter new password..."
                    required="required"
                    aria-required="true"
                    class="form-control modern-input"
                    [(ngModel)]="newPassword"
                    name="newPassword"
                    [disabled]="isLoading"
                  >
                </div>
              </div>
              <div id="confirmPasswordGroup" role="group" class="mb-3 modern-input-group">
                <label for="confirmPassword" class="form-label modern-label">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-lock"></i></span>
                  <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm new password..."
                    required="required"
                    aria-required="true"
                    class="form-control modern-input"
                    [(ngModel)]="confirmPassword"
                    name="confirmPassword"
                    [disabled]="isLoading"
                  >
                </div>
              </div>
              <div *ngIf="errorMessage" class="alert alert-danger mt-3 modern-alert">
                {{ errorMessage }}
              </div>
              <div *ngIf="successMessage" class="alert alert-success mt-3 modern-alert">
                {{ successMessage }}
              </div>
              <div class="divider modern-divider"></div>
              <h6 class="mb-0 modern-signup-text">
                Back to login? <a [routerLink]="['/login']" class="modern-signup-link">Sign in</a>
              </h6>
            </form>
          </div>
          <div class="modal-footer clearfix modern-footer">
            <div class="float-start">
              <a [routerLink]="['/pages/forgot-password-boxed']" class="btn btn-link modern-forgot-link">Request another reset link</a>
            </div>
            <div class="float-end">
              <button
                type="submit"
                class="btn btn-primary btn-lg w-100 modern-login-btn"
                (click)="onSubmit()"
                [disabled]="isLoading"
              >
                {{ isLoading ? 'Resetting...' : 'Reset Password' }}
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <div class="text-center text-white opacity-8 mt-3">
        Copyright © ArchitectUI 2025
      </div>
    </div>
  </div>
</div>
