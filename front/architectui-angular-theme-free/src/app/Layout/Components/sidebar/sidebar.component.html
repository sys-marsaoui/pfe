<button 
  class="sidebar-toggle" 
  [class.active]="!globals.toggleSidebar" 
  (click)="toggleSidebar()"
  *ngIf="isAdmin">
  <span class="bar"></span>
  <span class="bar"></span>
  <span class="bar"></span>
</button>

<aside 
  class="app-sidebar" 
  [class.collapsed]="globals.toggleSidebar"
  (mouseenter)="sidebarHover()" 
  (mouseleave)="sidebarHover()"
  *ngIf="isAdmin">

  <div class="sidebar-header">
    <div class="logo">
      <i class="bi bi-briefcase"></i>
      <span class="logo-text">HR Pro</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li class="nav-item">
        <a 
          routerLink="/postes" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{exact: true}"
          class="nav-link">
          <i class="bi bi-briefcase"></i>
          <span class="nav-text">Job Posts</span>
        </a>
      </li>

      <li class="nav-item">
        <a 
          routerLink="/quizList" 
          routerLinkActive="active"
          class="nav-link">
          <i class="bi bi-clipboard-check"></i>
          <span class="nav-text">Quizzes</span>
        </a>
      </li>

      <li class="nav-item">
        <a 
          routerLink="/candidats" 
          routerLinkActive="active"
          class="nav-link">
          <i class="bi bi-person-badge"></i>
          <span class="nav-text">Candidates</span>
        </a>
      </li>

      <li class="nav-item">
        <a 
          routerLink="/users" 
          routerLinkActive="active"
          class="nav-link">
          <i class="bi bi-people"></i>
          <span class="nav-text">Users</span>
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/statistics" routerLinkActive="active" class="nav-link">
          <i class="bi bi-bar-chart-line"></i>
          <span class="nav-text">Recruitment statistics</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
