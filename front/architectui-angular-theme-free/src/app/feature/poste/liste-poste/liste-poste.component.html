<div class="main-card mb-3 card">
    <div class="card-header">
      <h5 class="card-title">Liste des Postes</h5>
      <button class="btn btn-primary float-end" (click)="openCreatePostModal()">Créer un Post</button>
    </div>
    <div class="card-body">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Titre</th>
            <th>Description</th>
            <th>Date d'expiration</th>
            <th>Type de Contrat</th>
            <th>nbr Postes Overt</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let post of posts"   >
            <td>{{ post.title }}</td>
            <td>{{ post.description }}</td>
            <td>{{ post.expireDate }}</td>
            <td>{{ post.contractType }}</td>
            <td>{{ post.nbrOpenPost }}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" (click)="openDetail(post.id)">Details</button>
              <button class="btn btn-warning btn-sm me-2" (click)="openUpdatePostModal(post)">Modifier</button>
              <button class="btn btn-danger btn-sm" (click)="deletePost(post.id)">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
