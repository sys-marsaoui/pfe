<div class="post-modal">
  <div class="modal-header">
    <h3 class="modal-title">
      <i class="bi bi-briefcase"></i>
      {{ post ? 'Modifier le Poste' : 'Créer un Poste' }}
    </h3>
    <button class="btn-close" (click)="closeModal()" aria-label="Fermer">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <form [formGroup]="postForm" class="modal-body">
    <!-- Titre -->
    <div class="form-group">
      <label class="form-label">Titre</label>
      <input
        type="text"
        class="form-input"
        placeholder="Titre du poste"
        formControlName="title"
        required
      />
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea
        class="form-input"
        rows="3"
        placeholder="Description complète du poste"
        formControlName="description"
        required
      ></textarea>
    </div>

    <!-- Type de contrat -->
    <div class="form-group">
      <label class="form-label">Type de Contrat</label>
      <select class="form-select" formControlName="contractType" required>
        <option value="" disabled>Choisir un type</option>
        <option value="CDI">CDI</option>
        <option value="CDD">CDD</option>
        <option value="Stage">Stage</option>
      </select>
    </div>

    <!-- Nombre de postes ouverts -->
    <div class="form-group">
      <label class="form-label">Nombre de postes ouverts</label>
      <input
        type="number"
        class="form-input"
        placeholder="Ex: 3"
        formControlName="nbrOpenPost"
        min="1"
        required
      />
    </div>

    <!-- Quiz associé -->
    <div class="form-group">
      <label class="form-label">Quiz Associé</label>
      <select class="form-select" formControlName="quizId">
        <option value="">Aucun quiz</option>
        <option *ngFor="let quiz of quizzes" [value]="quiz.id">
          {{ quiz.title }}
        </option>
      </select>
    </div>

    <!-- Responsabilités -->
    <div class="form-group">
      <label class="form-label">Responsabilités</label>
      <div class="responsibility-list">
        <div *ngFor="let resp of responsibilities.controls; let i = index" [formGroupName]="i" class="responsibility-item">
          <input
            type="text"
            class="form-input"
            placeholder="Ex: Gérer l'équipe technique"
            formControlName="responsibility"
          />
          <button type="button" class="btn-delete" (click)="removeResponsibility(i)" title="Supprimer">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
      <button type="button" class="btn-add" (click)="addResponsibility()">
        <i class="bi bi-plus-circle"></i> Ajouter une responsabilité
      </button>
    </div>
    <!-- Date d'expiration -->
<div>
  <label class="form-label">Date d'expiration</label>
  <input
    type="date"
    class="form-input"
    formControlName="expireDate"
    required
  />
</div>
  </form>
  <div class="modal-footer">
    <button class="btn-secondary" (click)="closeModal()">Annuler</button>
    <button class="btn-primary" (click)="savePost()">
      {{ post ? 'Mettre à jour' : 'Créer le poste' }}
    </button>
  </div>
</div>
