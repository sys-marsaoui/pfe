<div class="modal-header">
  <h5 class="modal-title">{{ post ? 'Modifier le Poste' : 'Créer un Poste' }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>
<div class="modal-body">
  <form [formGroup]="postForm">
    <!-- Titre -->
    <div class="mb-3">
      <label for="title" class="form-label">Titre</label>
      <input
        id="title"
        type="text"
        class="form-control"
        placeholder="Titre du poste"
        formControlName="title"
        required
      />
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea
        id="description"
        class="form-control"
        placeholder="Description du poste"
        formControlName="description"
        rows="3"
        required
      ></textarea>
    </div>

    <!-- Type de contrat -->
    <div class="mb-3">
      <label for="contractType" class="form-label">Type de Contrat</label>
      <select id="contractType" class="form-select" formControlName="contractType" required>
        <option value="" disabled selected>Choisir un type de contrat</option>
        <option value="CDI">CDI</option>
        <option value="CDD">CDD</option>
        <option value="Stage">Stage</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="title" class="form-label">Nombre de poste overt</label>
      <input
        id="nbrOpenPost"
        type="text"
        class="form-control"
        placeholder="Nombre de poste overt"
        formControlName="nbrOpenPost"
        required
      />
    </div>    

    <!-- Quiz associé -->
    <div class="mb-3">
      <label for="quizId" class="form-label">Quiz Associé</label>
      <select id="quizId" class="form-select" formControlName="quizId">
        <option value="" disabled selected>Aucun Quiz</option>
        <option *ngFor="let quiz of quizzes" [value]="quiz.id">{{ quiz.title }}</option>
      </select>
    </div>

    <!-- Liste de responsabilités -->
    <div class="mb-3">
      <label class="form-label">Responsabilités</label>
      <div *ngFor="let responsibility of responsibilities.controls; let i = index" [formGroupName]="i" class="d-flex mb-2">
        <input
          type="text"
          class="form-control"
          placeholder="Responsabilité"
          formControlName="responsibility"
        />
        <button type="button" class="btn btn-danger ms-2" (click)="removeResponsibility(i)">Supprimer</button>
      </div>
      <button type="button" class="btn btn-primary mt-2" (click)="addResponsibility()">Ajouter une Responsabilité</button>
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="closeModal()">Annuler</button>
  <button type="button" class="btn btn-success" (click)="savePost()">{{ post ? 'Mettre à jour' : 'Créer' }}</button>
</div>
