spring.application.name=hiring
# Configuration du serveur
server.port=8989

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hiring1?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Configuration for MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hiring1}
# JWT
app.jwtSecret=${JWT_SECRET_BASE64}
app.jwtExpirationInMs=604800000
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
app.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
app.linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:}
app.linkedin.frontend-url=${PUBLIC_APP_URL:http://localhost:4200}
app.linkedin.api-version=${LINKEDIN_API_VERSION:202609}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


file.upload-dir=${user.dir}/Uploads/cvs/
